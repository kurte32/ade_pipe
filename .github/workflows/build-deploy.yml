name: build-deploy

# Build once, promote the same image digest and SPA bundles through dev -> test -> prod (ADR-010).
# Release tags reuse the digest main built for the same commit; prod deploys only after test is green.
# Required GitHub configuration per environment (dev, test, prod):
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credential)
#   vars:    ACR_NAME, RESOURCE_GROUP, VITE_TENANT_ID, VITE_SPA_CLIENT_ID_PWA, VITE_SPA_CLIENT_ID_ADMIN,
#            VITE_API_CLIENT_ID (written to each SPA's config.json at deploy time, not compiled in),
#            PUBLIC_HOST (Front Door or SWA host used for the smoke test)
#   test/prod OIDC principals also need AcrPull on the dev registry to import the image digest.
#   environments test and prod: required reviewers (release gate).
# Rollback: the container app runs in multiple-revision mode; shift traffic back to the previous
# revision with `az containerapp ingress traffic set` (see docs/AZURE_DEPLOYMENT.md section 9).
# Re-running this workflow with a previous image digest is the fallback when the revision is gone.

on:
  push:
    branches: [main]
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Existing image digest to (re)deploy, e.g. sha256:abc... (leave empty to build)"
        required: false
        default: ""
      target:
        description: "Environment to deploy"
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  contents: read
  id-token: write
  packages: read

env:
  IMAGE_NAME: pipeline-api

jobs:
  # Lint, type checks, unit and integration tests, secret scan and Bicep validation must pass
  # before anything is built or deployed (ADR-010, audit D-06).
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build, scan and push image; build SPA bundles
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      # Registry the image was pushed to (dev); later environments import the digest from it.
      source_registry: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reuse digest from input
        id: reuse
        if: ${{ inputs.image_digest != '' }}
        env:
          INPUT_DIGEST: ${{ inputs.image_digest }} # through env, never interpolated into the script (audit CI-5)
        run: |
          case "$INPUT_DIGEST" in sha256:[0-9a-f]*) ;; *) echo "image_digest must be sha256:<hex>"; exit 1;; esac
          echo "digest=$INPUT_DIGEST" >> "$GITHUB_OUTPUT"

      # A release tag promotes the image that main already built and dev already ran for this
      # commit, instead of rebuilding a different digest (audit CI-5). Falls back to a build when
      # the commit was never built (tag on an unbuilt commit).
      - name: Reuse digest built for this commit on main
        id: promote
        if: ${{ inputs.image_digest == '' && startsWith(github.ref, 'refs/tags/release-') }}
        run: |
          DIGEST=$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" --query digest -o tsv 2>/dev/null || true)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "main build for ${{ github.sha }}: ${DIGEST:-<none, building>}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ inputs.image_digest == '' && steps.promote.outputs.digest == '' }}

      - name: Build image (local, for scanning)
        if: ${{ inputs.image_digest == '' && steps.promote.outputs.digest == '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: INSTALL_DEV=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy, fail on CRITICAL)
        if: ${{ inputs.image_digest == '' && steps.promote.outputs.digest == '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: ACR login
        if: ${{ inputs.image_digest == '' && steps.promote.outputs.digest == '' }}
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Push image to ACR
        if: ${{ inputs.image_digest == '' && steps.promote.outputs.digest == '' }}
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: INSTALL_DEV=false
          cache-from: type=gha

      - name: Resolve digest
        id: digest
        run: |
          if [ -n "${{ steps.reuse.outputs.digest }}" ]; then
            echo "digest=${{ steps.reuse.outputs.digest }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.promote.outputs.digest }}" ]; then
            echo "digest=${{ steps.promote.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # Environment-neutral bundles: tenant and client ids are NOT compiled in. Each deployment
      # writes config.json next to the bundle (audit D-04, D-13), so the same files are promoted.
      - name: Build SPA bundles
        env:
          VITE_AUTH_MODE: msal
        run: |
          corepack enable && corepack prepare pnpm@12.11.2 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spa-bundles
          path: |
            apps/pwa-coordinador/dist
            apps/web-admin/dist
          if-no-files-found: error

  deploy-dev:
    name: Deploy dev
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev') }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      image_digest: ${{ needs.build.outputs.digest }}
      source_registry: ${{ needs.build.outputs.source_registry }}
    secrets: inherit

  # Depend only on build and guard with a status function: depending on deploy-dev caused a
  # cascade-skip on release tags (deploy-dev is skipped there), so test/prod deployed nothing
  # (audit D-05). Promotion order to prod is enforced by the prod environment's required reviewers.
  deploy-test:
    name: Deploy test (UAT)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && inputs.target == 'test')) }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
      image_digest: ${{ needs.build.outputs.digest }}
      source_registry: ${{ needs.build.outputs.source_registry }}
    secrets: inherit

  # Prod follows a green test deployment of the same tag (audit CI-5); a manual dispatch targeting
  # prod (rollback to a known digest) skips test and is held by the prod environment's reviewers.
  deploy-prod:
    name: Deploy prod
    needs: [build, deploy-test]
    if: ${{ !cancelled() && needs.build.result == 'success' && ((startsWith(github.ref, 'refs/tags/release-') && needs.deploy-test.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')) }}
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      image_digest: ${{ needs.build.outputs.digest }}
      source_registry: ${{ needs.build.outputs.source_registry }}
    secrets: inherit
