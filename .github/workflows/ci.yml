name: ci

on:
  pull_request:
  push:
    branches: [main, implementation]
  # Also called by build-deploy as a required gate before any image is built (audit D-06).
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused, so the standalone run and the deploy gate on
  # the same push do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend lint, types, unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load local development environment values
        run: |
          # Same values as .env.example (local development only); hosts stay localhost in CI.
          grep -E '^[A-Z_]+=' .env.example | sed -E 's/[[:space:]]*#.*$//' >> "$GITHUB_ENV"

      - name: Install Microsoft ODBC Driver 18
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 unixodbc

      - name: Start SQL Server 2022
        run: |
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}" \
            mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
          for _ in $(seq 1 60); do
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "SQL Server did not become healthy" && docker logs sqlserver && exit 1

      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck

      - name: Start dev identity provider
        run: |
          python3 -m pip install --quiet "fastapi>=0.115" "uvicorn>=0.30" "pyjwt[crypto]>=2.9"
          cd tools/dev-idp
          DEV_IDP_KEY_PATH=/tmp/dev-idp.pem DEV_IDP_PUBLIC_URL=http://localhost:8001 \
          DEV_TENANT_ID="${AUTH_TENANT_ID}" DEV_API_CLIENT_ID="${AUTH_AUDIENCE}" \
            nohup python3 -m uvicorn app:app --host 127.0.0.1 --port 8001 > /tmp/dev-idp.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:8001/healthz >/dev/null 2>&1 && exit 0; sleep 1; done
          cat /tmp/dev-idp.log && exit 1

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint and type-check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app

      - name: Dependency vulnerability audit (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict

      - name: Initialize database and apply migrations
        working-directory: backend
        run: |
          uv run python -m app.cli db-init
          uv run alembic upgrade head
          # Models and schema must agree; a drift here would end up in the next autogenerate.
          uv run alembic check

      - name: Unit and integration tests
        working-directory: backend
        # Coverage floor (backlog COV): measured at 89 % on 2026-10-11; raise it, never lower it.
        run: uv run pytest -q -p no:cacheprovider --junitxml=/tmp/pytest.xml --cov=app --cov-report=xml:/tmp/coverage.xml --cov-fail-under=80

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-report
          path: /tmp/pytest.xml

  frontend:
    name: Frontend lint, types, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.11.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
      # No bundle upload here: build-deploy builds the environment-neutral bundles itself, and two
      # "spa-bundles" artifacts in one run (CI is reused as its gate) would collide.

  e2e:
    name: End-to-end (Playwright against the compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm and install
        run: |
          corepack enable && corepack prepare pnpm@12.11.2 --activate
          pnpm install --frozen-lockfile
      - name: Start the local stack and seed it
        run: |
          cp .env.example .env
          make up
          make db-seed
      - name: Install Chromium for Playwright
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Start the Vite dev servers
        run: |
          nohup pnpm dev > /tmp/vite.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5173 >/dev/null 2>&1 && curl -fsS http://localhost:5174 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/vite.log && exit 1
      - name: Playwright suite
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 api dev-idp

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Bicep CLI (pinned and checksum-verified, audit D-09)
        env:
          BICEP_VERSION: "0.48.1"
          BICEP_SHA256: "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e"
        run: |
          curl -fsSL "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64" -o /tmp/bicep
          echo "${BICEP_SHA256}  /tmp/bicep" | sha256sum -c -
          sudo install -m 0755 /tmp/bicep /usr/local/bin/bicep
      - name: Validate templates and parameter files
        run: bash infra/bicep/validate.sh

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint (pinned and checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" actionlint
      - name: Lint workflows (run blocks are also shell-checked when shellcheck is on the runner)
        run: ./actionlint -color
